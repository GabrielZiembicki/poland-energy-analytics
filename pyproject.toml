[project]
name = "poland-energy-analytics"
version = "0.1.0"
description = "Analytical notebooks exploring the Polish power market."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.1",
    "numpy>=1.26",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "plotly>=5.20",
    "jupyterlab>=4.0",
    "ipykernel>=6.29",
    "python-dateutil>=2.9",
    "pyarrow>=15.0",
    "requests>=2.31",
    "statsmodels>=0.14",
]

[tool.uv]
package = false
